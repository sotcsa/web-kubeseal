<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web kubeseal</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Web kubeseal</h1>
      <p class="sub">
        SealedSecret generálás a böngészőben. A tanúsítvány és a titkok nem hagyják el a gépedet.
      </p>
    </header>

    <main>
      <section class="panel form">
        <div class="row">
          <label>Namespace <span class="req">*</span>
            <input id="namespace" type="text" placeholder="default" autocomplete="off" spellcheck="false" />
          </label>
          <label>Name <span class="req">*</span>
            <input id="name" type="text" placeholder="my-secret" autocomplete="off" spellcheck="false" />
          </label>
        </div>

        <label>Controller tanúsítvány (PEM) <span class="req">*</span>
          <textarea id="cert" rows="6" spellcheck="false"
            placeholder="-----BEGIN CERTIFICATE-----&#10;...&#10;-----END CERTIFICATE-----"></textarea>
        </label>
        <div class="hint">
          <span>Lekérése: <code>kubeseal --fetch-cert &gt; cert.pem</code></span>
          <label class="file-btn">Fájl betöltése<input id="certFile" type="file" accept=".pem,.crt,.cert,text/plain" hidden /></label>
        </div>
        <div id="certStatus" class="status"></div>

        <div class="row">
          <label>Secret típus
            <select id="type">
              <option value="Opaque">Opaque (kulcs-érték párok)</option>
              <option value="kubernetes.io/dockerconfigjson">Image pull secret (dockerconfigjson)</option>
            </select>
          </label>
          <label>Scope
            <select id="scope">
              <option value="strict">strict (namespace + name)</option>
              <option value="namespace-wide">namespace-wide</option>
              <option value="cluster-wide">cluster-wide</option>
            </select>
          </label>
        </div>

        <div id="opaqueFields">
          <h2>Kulcs-érték párok</h2>
          <div id="pairs"></div>
          <button id="addPair" type="button" class="secondary">+ Új pár</button>
        </div>

        <div id="dockerFields" hidden>
          <h2>Registry hitelesítés</h2>
          <label>Registry szerver <span class="req">*</span>
            <input id="dockerServer" type="text" placeholder="ghcr.io" autocomplete="off" spellcheck="false" />
          </label>
          <div class="row">
            <label>Felhasználónév <span class="req">*</span>
              <input id="dockerUsername" type="text" autocomplete="off" spellcheck="false" />
            </label>
            <label>Jelszó / token <span class="req">*</span>
              <input id="dockerPassword" type="password" autocomplete="new-password" />
            </label>
          </div>
          <label>E-mail (opcionális)
            <input id="dockerEmail" type="email" autocomplete="off" />
          </label>
        </div>
      </section>

      <section class="panel output">
        <div class="output-head">
          <h2>SealedSecret</h2>
          <div class="actions">
            <button id="copy" type="button" disabled>Másolás</button>
            <button id="download" type="button" class="secondary" disabled>Letöltés</button>
          </div>
        </div>
        <div id="errors" class="status error"></div>
        <pre id="output"><code>Add meg a namespace-t, a nevet és a tanúsítványt.</code></pre>
      </section>
    </main>

    <template id="pairTemplate">
      <div class="pair">
        <input class="pair-key" type="text" placeholder="kulcs" autocomplete="off" spellcheck="false" />
        <textarea class="pair-value" rows="1" placeholder="érték" spellcheck="false"></textarea>
        <button type="button" class="remove" title="Törlés" aria-label="Törlés">×</button>
      </div>
    </template>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
